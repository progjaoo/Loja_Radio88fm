services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:local first}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:local first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:local first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - radio88-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    image: loja-radio88-fm-dev:local
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:?Run pnpm env:local first}:${POSTGRES_PASSWORD:?Run pnpm env:local first}@postgres:5432/${POSTGRES_DB:?Run pnpm env:local first}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 30s

  frontend:
    image: loja-radio88-fm-dev:local
    pull_policy: never
    environment:
      NODE_ENV: development
      VITE_PORT: 20439
      VITE_HOST: 0.0.0.0
      BASE_PATH: ${BASE_PATH:-/}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
      LOCAL_API_PROXY_TARGET: http://api:8080
    command: ["pnpm", "--filter", "@workspace/radio88-store", "run", "dev"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VITE_PORT:-20439}:20439"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20439/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s

volumes:
  radio88-postgres-data:
