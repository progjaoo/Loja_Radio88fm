        productId: { type: string }
        productSlug: { type: string }
        productName: { type: string }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        categoryId: { type: ["string", "null"] }
        categoryName: { type: ["string", "null"] }
        categorySlug: { type: ["string", "null"] }
        lineId: { type: ["string", "null"] }
        lineName: { type: ["string", "null"] }
        lineSlug: { type: ["string", "null"] }
        baseSku: { type: ["string", "null"] }
        internalCode: { type: ["string", "null"] }
        pieceType: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        material: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        promotionalPrice: { type: ["number", "null"], minimum: 0 }
        promotionStartsAt: { type: ["string", "null"], format: date-time }
        promotionEndsAt: { type: ["string", "null"], format: date-time }
        featured: { type: boolean }
        productStatus:
          $ref: "#/components/schemas/ProductStatus"
        productActive: { type: boolean }
        variantId: { type: string }
        variantName: { type: string }
        sku: { type: string }
        barcode: { type: ["string", "null"] }
        size: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        attributes:
          type: object
          additionalProperties: { type: string }
        price: { type: number, minimum: 0 }
        costPrice: { type: ["number", "null"], minimum: 0 }
        stockOnHand: { type: integer, minimum: 0 }
        reservedStock: { type: integer, minimum: 0 }
        availableStock: { type: integer, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        weightGrams: { type: ["integer", "null"], minimum: 0 }
        dimensionsCm:
          type: ["object", "null"]
          properties:
            length: { type: number, minimum: 0 }
            width: { type: number, minimum: 0 }
            height: { type: number, minimum: 0 }
          required: [length, width, height]
        variantActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [productId, productSlug, productName, description, imageUrl, categoryId, categoryName, categorySlug, lineId, lineName, lineSlug, baseSku, internalCode, pieceType, brand, material, tags, promotionalPrice, promotionStartsAt, promotionEndsAt, featured, productStatus, productActive, variantId, variantName, sku, barcode, size, color, attributes, price, costPrice, stockOnHand, reservedStock, availableStock, minimumStock, weightGrams, dimensionsCm, variantActive, updatedAt]
    StockMovement:
      type: object
      properties:
        id: { type: string }
        variantId: { type: string }
        productName: { type: string }
        variantName: { type: string }
        sku: { type: string }
        movementType:
          $ref: "#/components/schemas/StockMovementType"
        delta: { type: integer }
        reservedDelta: { type: integer }
        quantityBefore: { type: ["integer", "null"] }
        quantityAfter: { type: ["integer", "null"] }
        reason: { type: string }
        orderId: { type: ["string", "null"] }
        orderNumber: { type: ["string", "null"] }
        actorId: { type: ["string", "null"] }
        actorName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, variantId, productName, variantName, sku, movementType, delta, reservedDelta, quantityBefore, quantityAfter, reason, orderId, orderNumber, actorId, actorName, createdAt]
    StockMovementPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
      required: [items, total, page, pageSize]
    StockMovementInput:
      type: object
      properties:
        variantId: { type: string, format: uuid }
        movementType: { type: string, enum: [inbound, outbound] }
        quantity: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 240 }
      required: [variantId, movementType, quantity, reason]
    StockCatalogImportRow:
      type: object
      properties:
        productSlug: { type: string, minLength: 1, maxLength: 160 }
        productName: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        imageUrl: { type: ["string", "null"], format: uri }
        baseSku: { type: ["string", "null"], maxLength: 80 }
        internalCode: { type: ["string", "null"], maxLength: 80 }
        categorySlug: { type: ["string", "null"], maxLength: 160 }
        lineSlug: { type: ["string", "null"], maxLength: 160 }
        pieceType: { type: ["string", "null"], maxLength: 80 }
        brand: { type: ["string", "null"], maxLength: 100 }
        material: { type: ["string", "null"], maxLength: 160 }
        tags:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 40 }
        promotionalPrice: { type: ["number", "null"], minimum: 0, maximum: 9999999999.99 }
