openapi: 3.1.0
info:
  # Keep this title: generated import paths depend on it.
  title: Api
  version: 0.1.0
  description: API for the Rádio 88 FM commerce MVP
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: storefront
  - name: account
  - name: checkout
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List active categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /homepage-layout:
    get:
      operationId: getHomepageLayout
      tags: [storefront]
      responses:
        "200":
          description: Homepage layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageLayout"
  /admin/homepage-layout:
    put:
      operationId: updateHomepageLayout
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageLayout"
      responses:
        "200":
          description: Saved layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageLayout"
        "400": { description: Invalid layout }
        "401": { description: Sign-in required }
        "403": { description: Permission required }
  /homepage-banner:
    get:
      operationId: getHomepageBanner
      tags: [storefront]
      summary: Get homepage banner configuration
      responses:
        "200":
          description: Banner configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBanner"
  /admin/homepage-banner:
    put:
      operationId: updateHomepageBanner
      tags: [admin]
      summary: Configure the homepage banner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageBannerUpdate"
      responses:
        "200":
          description: Saved banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageBanner"
        "400": { description: Invalid banner }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/media:
    post:
      operationId: uploadStoreImage
      tags: [admin]
      summary: Upload a public product or homepage image to object storage
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              $ref: "#/components/schemas/StoreImageFile"
          image/png:
            schema:
              $ref: "#/components/schemas/StoreImageFile"
          image/webp:
            schema:
              $ref: "#/components/schemas/StoreImageFile"
      responses:
        "201":
          description: Uploaded image URL for product or banner records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreImageAsset"
        "400": { description: Unsupported or invalid image }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "415": { description: Unsupported image media type }
        "413": { description: Maximum upload size is 8 MiB }
        "502": { description: Cloudflare R2 upload failed }
        "503": { description: Cloudflare R2 storage is not configured }
  /admin/media/video:
    post:
      operationId: uploadStoreVideo
      tags: [admin]
      summary: Validate and upload a short public homepage video to object storage
      description: Requires content:manage. Accepts silent H.264 MP4 up to 3.5 MiB and 15 seconds to remain below the Vercel Function request-body limit.
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              $ref: "#/components/schemas/StoreVideoFile"
      responses:
        "201":
          description: Validated video URL and media metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreVideoAsset"
        "400": { description: "Invalid MP4, codec, duration, dimensions or audio track" }
        "401": { description: Sign-in required }
        "403": { description: Content management permission required }
        "413": { description: Maximum upload size is 3.5 MiB }
        "415": { description: Only MP4 video is supported }
        "502": { description: Cloudflare R2 upload failed }
        "503": { description: Cloudflare R2 storage is not configured }
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: Search active products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: featured
          schema: { type: boolean }
        - in: query
          name: minPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: maxPrice
          schema: { type: number, minimum: 0 }
        - in: query
          name: pieceType
          description: Match the product's catalog type exactly.
          schema: { type: string, maxLength: 80 }
        - in: query
          name: sizes
          description: Pipe-separated exact variant sizes. Price and stock filters apply to the same variants.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: inStock
          description: Require a matching variant with available stock.
          schema: { type: boolean }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404": { description: Product not found }
  /favorites:
    get:
      operationId: listFavorites
      tags: [account]
      summary: List favorites for the signed-in customer
      responses:
        "200":
          description: Favorite products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401": { description: Sign-in required }
  /favorites/{productId}:
    put:
      operationId: addFavorite
      tags: [account]
      summary: Add a product to the signed-in customer's favorites
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Favorite product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401": { description: Sign-in required }
        "404": { description: Product not found }
    delete:
      operationId: removeFavorite
      tags: [account]
      summary: Remove a product from the signed-in customer's favorites
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Favorite removed }
        "401": { description: Sign-in required }
        "404": { description: Favorite not found }
  /cart:
    get:
      operationId: getCart
      tags: [checkout]
      summary: Get the signed-in customer's persistent cart
      responses:
        "200":
          description: Current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401": { description: Sign-in required }
  /cart/lines:
    post:
      operationId: addCartLine
      tags: [checkout]
      summary: Add or increment a cart line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartLineInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400": { description: Invalid quantity or unavailable stock }
        "401": { description: Sign-in required }
  /cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [checkout]
      summary: Change a cart-line quantity
      parameters:
        - in: path
          name: lineId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartLineUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401": { description: Sign-in required }
        "404": { description: Cart line not found }
    delete:
      operationId: removeCartLine
      tags: [checkout]
      summary: Remove a cart line
      parameters:
        - in: path
          name: lineId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401": { description: Sign-in required }
        "404": { description: Cart line not found }
  /frete/cotar:
    post:
      operationId: cotarFrete
      tags: [checkout]
      summary: Cotar SuperFrete com medidas e preços do catálogo no servidor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreteQuoteInput"
      responses:
        "200":
          description: Serviços disponíveis e indisponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FreteRate"
        "400": { description: CEP ou carrinho inválido }
        "401": { description: Autenticação necessária }
        "429": { description: Limite de cotações atingido }
        "503": { description: Serviço não configurado ou indisponível }
  /admin/shipping-settings:
    get:
      operationId: getShippingSettings
      tags: [admin]
      responses:
        "200":
          description: Configuração de frete sem credenciais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingSettingsResponse"
        "403": { description: Sem permissão }
    put:
      operationId: updateShippingSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingSettings"
      responses:
        "200":
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingSettingsResponse"
        "400": { description: Configuração inválida }
        "403": { description: Sem permissão }
  /shipping/quote:
    get:
      operationId: quoteShipping
      tags: [checkout]
      summary: Calculate SuperFrete shipping options for the signed-in cart
      parameters:
        - in: query
          name: postalCode
          required: true
          schema: { type: string, pattern: "^[0-9.-]{8,10}$" }
      responses:
        "200":
          description: Available shipping and pickup options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingOption"
        "400": { description: Invalid postal code }
  /shipping/guest-quote:
    post:
      operationId: quoteGuestShipping
      tags: [checkout]
      summary: Calculate shipping for an unauthenticated cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestShippingQuoteInput"
      responses:
        "200":
          description: Available shipping and pickup options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingOption"
        "400": { description: Invalid postal code or cart }
        "429": { description: Quote limit reached }
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Create an order and reserve stock pending manual PIX confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400": { description: "Invalid address, cart, or shipping option" }
        "401": { description: Sign-in required }
        "409": { description: Insufficient stock }
  /guest-checkout:
    post:
      operationId: createGuestCheckout
      tags: [checkout]
      summary: Create an order without requiring a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestCheckoutInput"
      responses:
        "201":
          description: Guest order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400": { description: "Invalid contact, address, cart, or shipping option" }
        "409": { description: Insufficient stock }
  /orders:
    get:
      operationId: listMyOrders
      tags: [account]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Customer order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401": { description: Sign-in required }
  /orders/{orderId}:
    get:
      operationId: getMyOrder
      tags: [account]
      summary: Get a customer's order
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401": { description: Sign-in required }
        "404": { description: Order not found }
  /orders/{orderId}/cancel:
    post:
      operationId: cancelMyOrder
      tags: [account]
      summary: Cancel an order before it is dispatched
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400": { description: Order can no longer be cancelled }
        "401": { description: Sign-in required }
        "404": { description: Order not found }
  /profile:
    get:
      operationId: getProfile
      tags: [account]
      summary: Get customer profile
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401": { description: Sign-in required }
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Update customer profile and communication preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401": { description: Sign-in required }
  /addresses:
    get:
      operationId: listAddresses
      tags: [account]
      summary: List customer addresses
      responses:
        "200":
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "401": { description: Sign-in required }
    post:
      operationId: createAddress
      tags: [account]
      summary: Save a customer address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Saved address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "401": { description: Sign-in required }
  /addresses/{addressId}:
    patch:
      operationId: updateAddress
      tags: [account]
      summary: Update a customer address
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "401": { description: Sign-in required }
        "404": { description: Address not found }
    delete:
      operationId: deleteAddress
      tags: [account]
      summary: Delete a customer address
      parameters:
        - in: path
          name: addressId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Address deleted }
        "401": { description: Sign-in required }
        "404": { description: Address not found }
  /profile/export:
    get:
      operationId: exportMyData
      tags: [account]
      summary: Export the signed-in customer's data
      responses:
        "200":
          description: Portable customer data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "401": { description: Sign-in required }
  /profile/data:
    delete:
      operationId: deleteMyProfile
      tags: [account]
      summary: Anonymize the signed-in customer's account data
      responses:
        "204": { description: Customer data anonymized }
        "401": { description: Sign-in required }
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get store totals and recent activity
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/product-lines:
    get:
      operationId: listAdminProductLines
      tags: [admin]
      summary: List product lines for administration
      responses:
        "200":
          description: Product lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductLine"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
    post:
      operationId: createProductLine
      tags: [admin]
      summary: Create a product line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLineInput"
      responses:
        "201":
          description: Created product line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLine"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/product-lines/{lineId}:
    patch:
      operationId: updateProductLine
      tags: [admin]
      summary: Update a product line
      parameters:
        - in: path
          name: lineId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLineUpdate"
      responses:
        "200":
          description: Updated product line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLine"
        "400": { description: Invalid product line }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Product line not found }
    delete:
      operationId: archiveProductLine
      tags: [admin]
      summary: Archive a product line, optionally reassigning its products
      parameters:
        - in: path
          name: lineId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLineReassignmentInput"
      responses:
        "204": { description: Product line archived }
        "400": { description: Invalid reassignment target }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Product line not found }
        "409": { description: Product line still has products that must be reassigned }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List all products for administration
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product with one or more variations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/products/status:
    patch:
      operationId: bulkUpdateProductStatus
      tags: [admin]
      summary: Update status for multiple products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBulkStatusUpdate"
      responses:
        "200":
          description: Number of products updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBulkStatusUpdateResponse"
        "400": { description: Invalid product selection }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/products/{productId}/variants:
    post:
      operationId: createProductVariant
      tags: [admin]
      summary: Add a variation to a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVariantInput"
      responses:
        "201":
          description: Created product variation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Product not found }
  /admin/products/{productId}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Product not found }
    delete:
      operationId: archiveProduct
      tags: [admin]
      summary: Archive a product without removing order history
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Product archived }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Product not found }
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all categories for administration
      responses:
        "200":
          description: Administrative category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a product category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Edit category details and icon
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400": { description: Invalid category }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Category not found }
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Archive a category, optionally reassigning its products
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryReassignmentInput"
      responses:
        "204": { description: Category archived }
        "400": { description: Invalid reassignment target }
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Category not found }
        "409": { description: Category still has products that must be reassigned }
  /admin/variants/{variantId}/stock:
    patch:
      operationId: adjustStock
      tags: [admin]
      summary: Set variation stock to an exact count
      parameters:
        - in: path
          name: variantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustment"
      responses:
        "200":
          description: Updated variation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "401": { description: Sign-in required }
        "403": { description: Admin or inventory access required }
        "404": { description: Variation not found }
  /admin/stock:
    get:
      operationId: listAdminStock
      tags: [admin]
      summary: List inventory variations with product details
      responses:
        "200":
          description: Inventory variations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockItem"
        "401": { description: Sign-in required }
        "403": { description: Admin or inventory access required }
  /admin/stock/movements:
    get:
      operationId: listAdminStockMovements
      tags: [admin]
      summary: List paginated inventory movement history
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: movementType
          schema:
            $ref: "#/components/schemas/StockMovementType"
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Inventory movement page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementPage"
        "401": { description: Sign-in required }
        "403": { description: Admin or inventory access required }
  /admin/stock/movements/manual:
    post:
      operationId: createAdminStockMovement
      tags: [admin]
      summary: Receive or dispatch inventory with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "201":
          description: Inventory movement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovement"
        "400": { description: Invalid movement }
        "401": { description: Sign-in required }
        "403": { description: Admin or inventory access required }
        "404": { description: Variation not found }
        "409": { description: Insufficient available stock }
  /admin/stock/import:
    post:
      operationId: importAdminStockCatalog
      tags: [admin]
      summary: Upsert product and inventory rows by SKU without deleting existing records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockCatalogImportInput"
      responses:
        "200":
          description: Imported product and inventory counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCatalogImportResponse"
        "400": { description: Invalid rows or promotion window }
        "401": { description: Sign-in required }
        "403": { description: Admin or inventory access required }
        "409": { description: SKU conflicts with a different product }
  /admin/variants/{variantId}:
    patch:
      operationId: updateProductVariant
      tags: [admin]
      summary: Update variation name, SKU, price, or low-stock threshold
      parameters:
        - in: path
          name: variantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVariantUpdate"
      responses:
        "200":
          description: Updated variation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: Variation not found }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List orders for fulfillment
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - in: query
          name: paymentStatus
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - in: query
          name: search
          schema:
            type: string
            maxLength: 120
        - in: query
          name: dateFrom
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - in: query
          name: dateTo
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401": { description: Sign-in required }
        "403": { description: Admin or operations access required }
  /admin/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order or payment status
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401": { description: Sign-in required }
        "403": { description: Admin or operations access required }
        "404": { description: Order not found }
  /admin/audit:
    get:
      operationId: listAuditEvents
      tags: [admin]
      summary: List recent administrative activity
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List customer and staff accounts
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreUser"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
  /admin/users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's operational role
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreUser"
        "401": { description: Sign-in required }
        "403": { description: Admin access required }
        "404": { description: User not found }
  /admin/capabilities:
    get:
      operationId: getAdminCapabilities
      tags: [admin]
      summary: Get the signed-in user's administrative permissions
      responses:
        "200":
          description: Effective permissions for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCapabilities"
        "401": { description: Sign-in required }
  /admin/permissions:
    get:
      operationId: listAdminPermissions
      tags: [admin]
      summary: List available administrative permissions
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPermission"
        "401": { description: Sign-in required }
        "403": { description: Role read access required }
  /admin/roles:
    get:
      operationId: listAdminRoles
      tags: [admin]
      summary: List roles and their permissions
      responses:
        "200":
          description: Roles available in the store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRole"
        "401": { description: Sign-in required }
        "403": { description: Role read access required }
    post:
      operationId: createAdminRole
      tags: [admin]
      summary: Create a custom administrative role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleCreate"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400": { description: Invalid role definition }
        "401": { description: Sign-in required }
        "403": { description: Role management access required }
  /admin/roles/{roleId}:
    patch:
      operationId: updateAdminRole
      tags: [admin]
      summary: Update a custom role
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRole"
        "400": { description: Invalid or protected role definition }
        "401": { description: Sign-in required }
        "403": { description: Role management access required }
        "404": { description: Role not found }
  /admin/users/{userId}/roles:
    patch:
      operationId: updateAdminUserRoles
      tags: [admin]
      summary: Replace a user's assigned roles
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserRolesUpdate"
      responses:
        "200":
          description: Updated user and effective access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreUser"
        "400": { description: Invalid role assignment or last-admin protection }
        "401": { description: Sign-in required }
        "403": { description: User and role management access required }
        "404": { description: User or role not found }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        iconName:
          $ref: "#/components/schemas/CategoryIcon"
      required: [id, name, slug, description]
    AdminCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        iconName:
          $ref: "#/components/schemas/CategoryIcon"
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, slug, description, iconName, active, createdAt]
    CategoryInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: ["string", "null"], maxLength: 400 }
        iconName:
          $ref: "#/components/schemas/CategoryIcon"
      required: [name]
    CategoryIcon:
      type: string
      enum: [shopping-bag, shirt, coffee, headphones, backpack, gift, disc, tag]
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: ["string", "null"], maxLength: 400 }
        iconName:
          $ref: "#/components/schemas/CategoryIcon"
        active: { type: boolean }
      minProperties: 1
    CategoryReassignmentInput:
      type: object
      properties:
        reassignToCategoryId: { type: string, format: uuid }
      minProperties: 1
    ProductBulkStatusUpdate:
      type: object
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/ProductStatus"
      required: [productIds, status]
    ProductBulkStatusUpdateResponse:
      type: object
      properties:
        updatedCount: { type: integer, minimum: 0 }
      required: [updatedCount]
    HomepageSection:
      type: object
      required: [id, enabled, title, description, limit, columns, categoryIds, productIds]
      properties:
        id: { type: string, enum: [hero, featured, catalog, categories] }
        enabled: { type: boolean }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 400 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        columns: { type: integer, minimum: 2, maximum: 4 }
        categoryIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
        productIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    HomepageLayout:
      type: object
      required: [sections, hero]
      properties:
        sections:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/HomepageSection"
        hero:
          type: object
          required: [title, description, ctaLabel, ctaHref, alignment]
          properties:
            title: { type: string, minLength: 1, maxLength: 120 }
            description: { type: string, maxLength: 400 }
            ctaLabel: { type: string, minLength: 1, maxLength: 60 }
            ctaHref: { type: string, minLength: 1, maxLength: 2048 }
            alignment: { type: string, enum: [left, center] }
    HomepageBanner:
      type: object
      properties:
        enabled: { type: boolean }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 400 }
        imageUrl: { type: ["string", "null"], format: uri }
        mobileImageUrl: { type: ["string", "null"], format: uri }
        alt: { type: string, maxLength: 240 }
        ctaLabel: { type: string, maxLength: 60 }
        ctaHref: { type: ["string", "null"], maxLength: 2048 }
        slides:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/HomepageBannerSlide" }
      required: [enabled, title, description, imageUrl, mobileImageUrl, alt, ctaLabel, ctaHref, slides]
    HomepageBannerUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        slides:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/HomepageBannerSlide" }
      required: [enabled, slides]
    HomepageBannerSlide:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 400 }
        imageUrl: { type: ["string", "null"], format: uri }
        mobileImageUrl: { type: ["string", "null"], format: uri }
        alt: { type: string, maxLength: 240 }
        ctaLabel: { type: string, maxLength: 60 }
        ctaHref: { type: ["string", "null"], maxLength: 2048 }
        mediaType: { type: string, enum: [image, video] }
        videoUrl: { type: ["string", "null"], format: uri }
        mobileVideoUrl: { type: ["string", "null"], format: uri }
        posterUrl: { type: ["string", "null"], format: uri }
        mobilePosterUrl: { type: ["string", "null"], format: uri }
        imageDurationMs: { type: integer, minimum: 3000, maximum: 15000 }
      required: [id, enabled, title, description, imageUrl, mobileImageUrl, alt, ctaLabel, ctaHref]
    StoreImageFile:
      type: string
      format: binary
    StoreVideoFile:
      type: string
      format: binary
    StoreVideoAsset:
      type: object
      properties:
        url: { type: string, format: uri }
        contentType: { type: string, enum: [video/mp4] }
        byteSize: { type: integer, minimum: 1, maximum: 3670016 }
        durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 15 }
        width: { type: integer, minimum: 320, maximum: 1920 }
        height: { type: integer, minimum: 320, maximum: 1200 }
      required: [url, contentType, byteSize, durationSeconds, width, height]
    StoreImageAsset:
      type: object
      properties:
        url: { type: string, format: uri }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer, minimum: 1, maximum: 8388608 }
      required: [url, contentType, byteSize]
    ProductStatus:
      type: string
      enum: [active, hidden, inactive]
    ProductImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        alt: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }
        isHover: { type: boolean }
      required: [id, url, alt, sortOrder, isPrimary, isHover]
    ProductImageInput:
      type: object
      properties:
        url: { type: string, format: uri }
        alt: { type: string, maxLength: 240 }
        sortOrder: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }
        isHover: { type: boolean }
      required: [url, alt, sortOrder, isPrimary]
    ProductLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, name, slug, description, active, createdAt]
    ProductLineInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
      required: [name]
    ProductLineUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        active: { type: boolean }
      minProperties: 1
    ProductLineReassignmentInput:
      type: object
      properties:
        reassignToLineId: { type: string, format: uuid }
      minProperties: 1
    ProductVariant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: string }
        price: { type: number, minimum: 0, maximum: 9999999999.99 }
        stock: { type: integer, minimum: 0 }
        lowStockThreshold: { type: integer, minimum: 0 }
        minimumStock: { type: integer, minimum: 0 }
        reservedStock: { type: integer, minimum: 0 }
        stockOnHand: { type: integer, minimum: 0 }
        barcode: { type: ["string", "null"], maxLength: 80 }
        size: { type: ["string", "null"], maxLength: 40 }
        color: { type: ["string", "null"], maxLength: 60 }
        attributes:
          type: object
          additionalProperties: { type: string, maxLength: 100 }
        costPrice: { type: ["number", "null"], minimum: 0, maximum: 9999999999.99 }
        weightGrams: { type: ["integer", "null"], minimum: 0 }
        dimensionsCm:
          type: ["object", "null"]
          properties:
            length: { type: number, minimum: 0 }
            width: { type: number, minimum: 0 }
            height: { type: number, minimum: 0 }
          required: [length, width, height]
        active: { type: boolean }
      required: [id, name, sku, price, stock, lowStockThreshold, active]
    StockMovementType:
      type: string
      enum: [inbound, outbound, manual_adjustment, sale, reservation, cancellation, return]
    StockItem:
      type: object
